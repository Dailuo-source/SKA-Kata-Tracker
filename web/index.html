<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKA Kata Tracker</title>
<meta name="description" content="Which kata each member of the Scarborough Academy of Karate knows.">
<meta name="theme-color" content="#C8102E">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* SKA Kata Tracker. Same look as the SKA Lesson Planner: red header with the dojo logo,
   black secondary, white cards on a light grey page (Gary's choice), bottom tab bar. */
:root{
  --red:#C8102E; --red-d:#A00D25; --red-soft:#FDE7EA; --red-tint:#FDF1F2;
  --ink:#111111; --ink2:#3A3A3A; --muted:#5E5E5E; --line:#E2E2E2; --line2:#D6D6D6; --sunk:#F5F5F5;
  --bg:#ECECEA; --card:#FFFFFF;
  --f-d:"M PLUS Rounded 1c","Avenir Next",system-ui,sans-serif;
  --f-b:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabh:66px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red-d)}
:focus-visible{outline:3px solid rgba(200,16,46,.5);outline-offset:2px}
svg{flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px 14px}
.top-in{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--f-d);font-weight:800;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;font-weight:700;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{height:40px;padding:0 12px;border-radius:20px;border:1.5px solid #fff;background:transparent;color:#fff;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;white-space:nowrap;text-decoration:none}
.hbtn.on{background:#fff;color:var(--red)}
.hbtn.icon{width:40px;padding:0;justify-content:center}
.hbtn svg{width:16px;height:16px}

/* Page */
main{max-width:640px;margin:0 auto;padding:18px 16px calc(var(--tabh) + 40px + env(safe-area-inset-bottom))}
h1{font-family:var(--f-d);font-weight:800;font-size:26px;line-height:1.2;margin:0}
.sub{font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px}
.pad{padding:16px}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:24px;border:1.5px solid var(--line2);background:#fff}
.search svg{width:20px;height:20px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line2);background:#fff;font-size:14px;font-weight:800;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.chip.dark[aria-pressed=true]{background:var(--ink);border-color:var(--ink)}
.dot{width:14px;height:14px;border-radius:7px;flex:none;display:inline-block;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.22)}
.dot.lg{width:22px;height:22px;border-radius:11px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:12px;white-space:nowrap;background:#fff;border:1.5px solid var(--line2);color:var(--ink)}
.tag.red{background:var(--red);border-color:var(--red);color:#fff}
.tag.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.tag.soft{background:var(--sunk);border-color:var(--sunk);color:var(--ink2);font-weight:700}
.tag.need{background:var(--red-soft);border-color:var(--red-soft);color:#8E0B21}
.tag svg{width:14px;height:14px}
.bar{height:8px;border-radius:4px;background:#EFEFEF;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:4px}
.bar.red>i{background:var(--red)}
.bar.big{height:12px;border-radius:6px}

/* Belt groups and rows */
.group{overflow:hidden}
.ghead{width:100%;min-height:56px;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 16px;border:0;background:#FAFAFA;text-align:left}
.ghead .t{font-family:var(--f-d);font-size:16px;font-weight:800}
.ghead .s{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.ghead svg.chev{width:20px;height:20px;color:var(--ink2)}
.ghead.static{cursor:default}
.mrow{display:flex;flex-direction:column;gap:6px;width:100%;padding:12px 16px;border:0;border-top:1px solid #ECECEC;background:transparent;text-align:left;color:var(--ink)}
.mrow:active,.krow:active{background:#F7F7F7}
.mrow .n{flex:1;min-width:0;font-size:16px;font-weight:800}
.mrow .c{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.krow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 12px 8px 16px;border:0;border-top:1px solid #ECECEC;background:transparent;text-align:left;color:var(--ink)}
.krow .n{font-size:15.5px;font-weight:800}
.krow .s{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.krow .need{color:#8E0B21}
.krow svg.go{width:16px;height:16px;color:var(--muted)}

/* Statuses */
.st{font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:12px;white-space:nowrap;border:1.5px solid transparent;flex:none;line-height:1.3}
.st-none{background:#fff;color:var(--muted);border:1.5px dashed #9A9A9A}
.st-0{background:#FCEBDD;color:#8A3F0C;border-color:#FCEBDD}
.st-1{background:#E3EBFB;color:#1F4BA5;border-color:#E3EBFB}
.st-2{background:var(--ink);color:#fff;border-color:var(--ink)}
button.st{min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
button.st svg{width:14px;height:14px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:44px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;font-size:14px;font-weight:800;color:var(--ink2)}
.seg button.on0{background:#FCEBDD;color:#8A3F0C;border-color:#E8A877}
.seg button.on1{background:#E3EBFB;color:#1F4BA5;border-color:#8FAEEA}
.seg button.on2{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button:disabled{opacity:.55}
.pcard{padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:10px}

/* Stats */
.big{font-family:var(--f-d);font-size:34px;font-weight:800;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.tile b{font-family:var(--f-d);font-size:22px;font-weight:800;line-height:1.2}
.tile span{font-size:12.5px;font-weight:800}
.alert{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:14px;background:var(--red-soft);color:#8E0B21;font-size:14px;font-weight:800}
.alert svg{width:20px;height:20px;margin-top:1px}
.alert.ok{background:var(--red);color:#fff}

.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 8px 0 2px;margin:-8px 0 -4px -2px;border:0;background:none;font-size:15px;font-weight:800;color:var(--ink);align-self:flex-start}
.back svg{width:20px;height:20px}
.textbtn{border:0;background:none;font-weight:800;color:var(--ink2);min-height:44px;padding:0 10px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:8px}
.linkbtn{border:0;background:none;padding:8px 0;font-weight:800;color:var(--ink2);text-decoration:underline;font-size:12.5px}
.err{background:var(--red-soft);color:var(--red-d);border-radius:14px;padding:12px 14px;font-weight:700}
.skel{height:64px;border-radius:20px;background:linear-gradient(90deg,#E2E2E0 25%,#EFEFED 50%,#E2E2E0 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.hint{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 4px}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs-in{display:grid;gap:4px;max-width:640px;margin:0 auto}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:16px;font-size:12px;font-weight:700;color:var(--ink2);min-height:52px}
.tabs button[aria-current=page]{background:var(--red);color:#fff;font-weight:800}
.tabs svg{width:22px;height:22px}

/* Sheets, confirm and toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:24px}}
.grab{width:44px;height:5px;border-radius:3px;background:#E2DCEA;margin:0 auto 12px}
.sheet h2{margin:0;font-family:var(--f-d);font-size:22px;font-weight:800;line-height:1.25}
.sheet p{margin:6px 0 14px;color:var(--ink2);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.inp{height:48px;padding:0 14px;border:1.5px solid var(--line2);border-radius:14px;font-size:16px;background:#fff}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--red)}
.btnrow{display:flex;gap:10px}
.btn{flex:1;min-height:48px;border-radius:16px;border:1.5px solid var(--line2);background:#fff;font-size:15px;font-weight:800}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.6}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:16px;border:1.5px solid #EEE8F3;background:#fff;text-align:left;font-size:16px;font-weight:800}
.opt.cur{border:3px solid var(--ink)}
.opt .sw{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.opt .cur-l{margin-left:auto;font-size:12.5px;color:var(--muted)}
.ferr{color:var(--red-d);font-size:13px;font-weight:700;min-height:18px;margin:4px 0 8px}
.float{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom));z-index:45;max-width:616px;margin:0 auto;background:var(--ink);color:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.confirm{padding:16px;display:flex;flex-direction:column;gap:12px}
.confirm .q{font-size:15px;font-weight:800;line-height:1.35}
.confirm .btn{border-color:#5E5E5E;background:transparent;color:#fff}
.confirm .btn.primary{background:var(--red);border-color:var(--red)}
.toast{padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.toast .m{flex:1;font-size:14px;font-weight:800}
.toast .ok{width:20px;height:20px;color:#7FD98F}
.toast .undo{min-height:44px;padding:0 16px;border-radius:14px;border:0;background:#fff;color:var(--red);font-size:15px;font-weight:800}
.toast.bad{background:var(--red)}

/* Accounts, requests and access */
.acct{height:40px;padding:0 12px 0 4px;border-radius:20px;border:1.5px solid #fff;background:transparent;color:#fff;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;white-space:nowrap}
.acct .ini{width:32px;height:32px;border-radius:16px;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.h2{font-family:var(--f-d);font-size:20px;font-weight:800;line-height:1.25;margin:0}
.cathead{display:flex;align-items:center;gap:8px;margin:8px 4px -2px}
.cathead .h2{flex:1}
.warn{background:#FFF1CC;color:#5C4100;border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.45}
.warncard{background:#FFF1CC;color:#5C4100;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.warncard .h2{font-size:16px}
.warncard .btn{flex:none;align-self:flex-start;padding:0 16px;background:transparent;border-color:#5C4100;color:#5C4100;min-height:44px}
.req{padding:16px;display:flex;flex-direction:column;gap:10px}
.req .who{font-size:14px;font-weight:800}
.req .when{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.quote{padding:10px 12px;border-radius:14px;background:#F4F4F2;font-size:14px;font-weight:600;color:var(--ink2)}
.tag.ok{background:#E3F3E6;border-color:#E3F3E6;color:#1D6B30}
.codebox{background:var(--ink);color:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.codebox b{font-family:var(--f-d);font-size:30px;font-weight:800;letter-spacing:4px;line-height:1.2}
.codebox span{font-size:13px;font-weight:700;color:#E2E2E2}
.codebox .btn{flex:none;align-self:flex-start;background:#fff;color:var(--ink);border-color:#fff;min-height:40px;padding:0 14px}
.inp.code{font-family:var(--f-d);font-size:22px;font-weight:800;letter-spacing:3px;text-transform:uppercase;height:54px}
.inp.code::placeholder{text-transform:none;letter-spacing:0;font-weight:600;font-size:17px;font-family:var(--f-b)}
textarea.inp{height:auto;padding:10px 14px;resize:none;font-size:15px;line-height:1.4}
.tabs button{position:relative}
.tabs-in.five button{font-size:11.5px}
.tabs .badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tabs button[aria-current=page] .badge{background:#fff;color:var(--red)}
.chip.dash{border-style:dashed;color:var(--ink2);display:inline-flex;align-items:center;gap:4px}
.chip.dash svg{width:16px;height:16px}
.chip.wait{border:1.5px dashed var(--red);color:#8E0B21;background:#fff;display:inline-flex;align-items:center;cursor:default}
.sec{border-top:1px solid #ECECEC;padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:13px;font-weight:800;color:var(--muted)}
.seg.lv{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.lv button{font-size:13px;padding:0 4px}
.seg.lv button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt[aria-pressed=true]{border:3px solid var(--red);background:var(--red-tint)}
.frow{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:700}
.frow .btn{flex:none;min-height:40px;padding:0 14px;font-size:13.5px}

/* Tap feedback */
button,a{transition:transform .08s ease,filter .12s ease}
button:active:not(:disabled),a:active{transform:scale(.96);filter:brightness(.92)}
.hbtn,.acct{position:relative}
.acct.compact{padding:0 3px}
.hbadge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#fff;color:var(--red);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:7px}
.chip .cnt{font-size:11.5px;padding:1px 7px;border-radius:9px;background:#F0F0F0;color:var(--muted)}
.chip[aria-pressed=true] .cnt{background:#3A3A3A;color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px}
.chips.scroll .chip{flex:none}

/* Wide screens (a computer, or inside the dojo's Wix page): a slim top bar instead of the
   red header and bottom tabs, and pages up to 1,240 px wide. */
.dnav{display:none}
body.wide .top,body.wide .tabs{display:none}
body.wide .dnav{display:flex;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1.5px solid var(--line);padding:10px 20px;align-items:center;gap:4px;flex-wrap:wrap}
.dnav .b2{font-family:var(--f-d);font-size:17px;font-weight:800;margin-right:12px;display:flex;align-items:center;gap:8px}
.dnav .b2 i{width:10px;height:22px;border-radius:3px;background:var(--red)}
.dnav .nl{height:40px;padding:0 14px;border-radius:20px;border:0;background:none;font-size:15px;font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.dnav .nl[aria-current=page]{background:var(--red);color:#fff}
.dnav .nb{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--red);color:#fff}
.dnav .nl[aria-current=page] .nb{background:#fff;color:var(--red)}
.dnav .sp{flex:1 1 8px}
.dnav .ib{width:40px;height:40px;border-radius:20px;border:1.5px solid var(--line2);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.dnav .ib svg{width:18px;height:18px}
.dnav .a2{height:40px;padding:0 12px 0 4px;border-radius:20px;border:1.5px solid var(--line2);background:#fff;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:8px}
.dnav .a2 .ini{width:30px;height:30px;border-radius:15px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.dnav .a2.out{padding:0 14px;background:var(--red);border-color:var(--red);color:#fff}
body.wide main{padding:22px 20px 40px}
body.wide main.full{max-width:1240px}
body.wide .float{bottom:22px}
body.wide .chips.scroll{flex-wrap:wrap;overflow:visible;margin:0;padding:0}

/* Overview, Members, Grid and Readiness */
.pg-h{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.pg-h>.grow{flex:1 1 220px}
.tilesx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
body.wide .tilesx{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:1px;text-align:left;color:var(--ink)}
.stat .l{font-size:12.5px;font-weight:700;color:var(--muted)}
.stat b{font-family:var(--f-d);font-size:24px;font-weight:800;line-height:1.2}
.stat .s{font-size:12.5px;font-weight:700;color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.cols>.mainc{flex:999 1 520px;min-width:0}
.cols>.side{flex:1 1 320px;min-width:0}
.cols>.half{flex:1 1 380px;min-width:0}
.ct{margin:0;font-family:var(--f-d);font-size:17px;font-weight:800;line-height:1.25}
.cardx{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.cardx .hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.cardx .hd .ct{flex:1}
.hbar{display:grid;grid-template-columns:84px minmax(0,1fr) 34px;align-items:center;gap:10px}

        report({ stage: 'script', fn: fn, err: String((e2 && e2.message) || e2) });

/* ---------- small helpers ---------- */

function first(name) { return String(name).split(' ')[0]; }
function shortName(name) { var w = String(name).split(' '); return w.length > 1 ? w[0] + ' ' + w[w.length - 1][0] + '.' : name; }
function initials(name) {
  var w = String(name || '').replace(/\(.*?\)/g, '').split(/\s+/).filter(function (x) { return x && !/\.$/.test(x); });
  if (!w.length) return '?';
  return (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase();

function parseTime(s) { var d = new Date(s); return isNaN(d.getTime()) ? null : d; }
function shortDate(s) { var d = parseTime(s); return d ? d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }) : ''; }

  if (min < 2) return 'Just now';

}

/* ---------- who is signed in ---------- */
function me() { return state.data && state.data.me; }

  var T = [['members', 'Members', ICON.people], ['kata', 'Kata', ICON.book], ['grid', 'Grid', ICON.grid], ['home', 'Overview', ICON.home],

function barTabs() { return tabList().filter(function (t) { return !isMod() || (t[0] !== 'requests' && t[0] !== 'access'); }); }

/* Wide screens: a computer, or the tracker inside the dojo's Wix page. */
var wideMq = window.matchMedia ? window.matchMedia('(min-width: 900px)') : null;
function wide() { return !!(wideMq && wideMq.matches); }
if (wideMq) { var onWide = function () { if (state.data) render(); }; if (wideMq.addEventListener) wideMq.addEventListener('change', onWide); else if (wideMq.addListener) wideMq.addListener(onWide); }
var inFrame = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ---------- belts, statuses, kata ---------- */

function dot(name, lg) { return '<span class="dot' + (lg ? ' lg' : '') + '" style="background:' + esc(beltColor(name)) + '"></span>'; }

/** The belt a kata is expected at: its handbook "Learned at" belt, else its rank. */

function kataByName(n) { return state.data.kata.filter(function (k) { return k.name === n; })[0]; }

  var seen = {};

  var out = CATEGORIES.slice(1).filter(function (c) { return seen[c]; });
  Object.keys(seen).sort().forEach(function (c) { if (out.indexOf(c) === -1) out.push(c); });

/** Kata a member is expected to know by now (at or below their belt). */

}

  if (!req.length) return null;

/* ---------- navigation: every screen and panel is a history step, so the phone's back

function waitingCount() { return state.data && state.data.requests ? state.data.requests.length : 0; }

/* ----- Signing in ----- */

function openSignIn(reason) {

    signInForm() + '<div class="btnrow" style="margin-top:8px"><button type="button" class="btn" data-close>Cancel</button></div>');

    if (code.length < 4) { err.textContent = 'Type the code from your instructor.'; return; }
    p = call('signIn', code);
  } else {
    var pw = form.elements.pw.value, name = form.elements.name.value.trim();
    if (!pw) return;

    saveSession({ p: res.p, k: res.k, name: res.name, level: res.level }, keep);
    state.pwMode = false;
    closeSheet();
    var link = state.fromPlanner && state.kata;
    state.data = publicData(state.data);

    try { history.replaceState(snapshot(), ''); } catch (e) {}

    load();
  }).catch(function (e) { err.textContent = errMsg(e); btn.disabled = false; });
}
function saveSession(s, keep) {

}
/** What anyone may see: drops everything that came with a sign-in. */
function publicData(d) {

  return { dojoName: d.dojoName, belts: d.belts, statuses: d.statuses, kata: d.kata, members: [], progress: {}, me: null, passwordOn: d.passwordOn, loadedAt: d.loadedAt };

function signOut(quiet, msg) {

function openAccount() {

    '<div class="hint" style="margin:0">' + esc(LEVEL_HINT[level()] || '') + '</div>' + fam +
    (isAdmin() ? '<div class="sec"><button type="button" class="btn" data-goto="access" style="display:flex;align-items:center;justify-content:center;gap:8px">' +
      ICON.key.replace('<svg', '<svg style="width:18px;height:18px"') + 'Access: levels, codes and family links' + (linkCount() ? ' (' + linkCount() + ' waiting)' : '') + '</button></div>' : '') +

/* ----- Members (moderators): a simple list (a table on wide screens) and one member's kata ----- */
var MSORT = { beltDesc: 'Belt, highest first', beltAsc: 'Belt, lowest first', last: 'Last name', known: 'Most kata known' };
var ms = { belt: 'All', sort: MSORT[recall('kt.msort')] ? recall('kt.msort') : 'beltDesc', all: false };
function lastName(n) { var w = String(n || '').replace(/\(.*?\)/g, '').trim().split(/\s+/); return (w[w.length - 1] || '').toLowerCase(); }
function byLastName(a, b) { return lastName(a.name).localeCompare(lastName(b.name)) || a.name.localeCompare(b.name); }
/** Lowest-to-highest counts per status for one member, across every kata. */
function tally(m) {
  var t = statuses().map(function () { return 0; });
  state.data.kata.forEach(function (k) { var i = statusIndex(statusOf(m.name, k.name)); if (i >= 0) t[i]++; });
  return t;
}
function knownTotal(t) { var n = 0; t.forEach(function (c, i) { if (statuses().length > 1 ? i >= 1 : true) n += c; }); return n; }
/** Belt (highest first) then last name, unless the person picked another order. */
function sortMembers(list, how) {
  var known = {};
  if (how === 'known') list.forEach(function (m) { known[m.name] = knownTotal(tally(m)); });
  var f = how === 'beltAsc' ? function (a, b) { return (beltIndex(a.belt) - beltIndex(b.belt)) || byLastName(a, b); }
    : how === 'last' ? byLastName
    : how === 'known' ? function (a, b) { return (known[b.name] - known[a.name]) || byLastName(a, b); }
    : function (a, b) { return (beltIndex(b.belt) - beltIndex(a.belt)) || byLastName(a, b); };
  return list.slice().sort(f);
}
function lastChanges() { var out = {}; (state.data.log || []).forEach(function (e) { if (!out[e.member]) out[e.member] = e.time; }); return out; }
function shownMembers() {
  return sortMembers(state.data.members.filter(function (m) { return matches(state.query, m.name) && (ms.belt === 'All' || m.belt === ms.belt); }), ms.sort);
}
function memberCountText(n) { var all = state.data.members.length; return n === all ? all + ' active members' : n + ' of ' + all + ' members'; }

function memberList() { return membersView(); }
/** Wide screens show the member beside the list, so picking one doesn't jump the page. */
function openMember(name) {
  if (wide() && state.tab === 'members') {
    state.member = name;
    try { history.replaceState(snapshot(), ''); } catch (e) {}
    render();
    var p = document.querySelector('.mpanel'); if (p) p.scrollTop = 0;
  } else go('members', name);
}
function membersView() {
  var d = state.data, W = wide();
  var m = state.member ? memberByName(state.member) : null;
  if (state.member && !m) state.member = null;
  if (!W && m) return '<div class="stack"><button type="button" class="back" data-back>' + ICON.back + 'All members</button>' + memberPanel(m) + '</div>';
  var used = belts().filter(function (b) { return d.members.some(function (x) { return x.belt === b.name; }); }).map(function (b) { return b.name; });
  if (ms.belt !== 'All' && used.indexOf(ms.belt) === -1) ms.belt = 'All';
  var list = shownMembers();
  var html = '<div class="pg-h"><div class="grow"><h1>Members</h1><div class="sub" id="mcount">' + esc(memberCountText(list.length)) + '</div></div>' +
    (W ? '<div style="flex:0 1 260px">' + searchBox('Search members') + '</div>' : '') + '</div>' +
    (W ? '' : searchBox('Search members')) +
    '<div class="chips scroll" role="group" aria-label="Belt">' + ['All'].concat(used).map(function (b) {
      return '<button type="button" class="chip dark" data-mbelt="' + esc(b) + '" aria-pressed="' + (ms.belt === b) + '">' + (b === 'All' ? '' : dot(b)) + esc(b) + '</button>';
    }).join('') + '</div>' +
    '<div class="frow2"><span class="flabel">Sort by</span><div class="segx" role="group" aria-label="Sort members">' + Object.keys(MSORT).map(function (k) {
      return '<button type="button" data-msort="' + k + '" aria-pressed="' + (ms.sort === k) + '">' + esc(W ? MSORT[k] : MSORT[k].replace(', highest first', ' ↓').replace(', lowest first', ' ↑')) + '</button>';
    }).join('') + '</div></div>' +
    '<div id="results">' + memberRows() + '</div>';
  if (!W) return '<div class="stack">' + html + '</div>';
  return '<div class="cols"><div class="mainc stack">' + html + '</div><div class="side">' +
    (m ? memberPanel(m) : '<div class="mpanel"><div class="empty" style="padding:24px 8px">Pick a member to see and change their kata.</div></div>') + '</div></div>';
}

function memberRows() {
  var d = state.data, list = shownMembers(), W = wide(), last = lastChanges(), hasLog = !!d.log;
  var c = $('mcount'); if (c) c.textContent = memberCountText(list.length);
  if (!d.members.length) return '<div class="card empty">No members yet. Add them on the Members tab of the Google Sheet.</div>';
  if (!list.length) return '<div class="card empty">No members match.</div>';
  if (W) {
    return '<div class="card" style="overflow-x:auto"><table class="tbl"><thead><tr><th scope="col">Member</th><th scope="col">Belt</th><th scope="col" class="r">Kata known</th><th scope="col" class="r">Learning</th>' +
      (hasLog ? '<th scope="col" class="r">Last change</th>' : '') + '</tr></thead><tbody>' + list.map(function (m) {
        var t = tally(m), l = t[0] || 0;
        return '<tr data-mrow="' + esc(m.name) + '"' + (state.member === m.name ? ' class="sel"' : '') + '><td><button type="button" class="mrow" data-mopen="' + esc(m.name) + '">' + esc(m.name) + '</button></td>' +
          '<td><span class="row" style="gap:8px;font-weight:700">' + dot(m.belt) + esc(m.belt || '–') + '</span></td>' +
          '<td class="r"><span class="kn">' + knownTotal(t) + '</span></td>' +
          '<td class="r">' + (l ? '<span class="lp">' + l + '</span>' : '<span style="color:#9A9A9A;font-weight:700">–</span>') + '</td>' +
          (hasLog ? '<td class="r" style="color:var(--muted);font-weight:700">' + esc(last[m.name] ? ago(last[m.name]) : '–') + '</td>' : '') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }
  return '<div class="mlist">' + list.map(function (m) {
    var t = tally(m), l = t[0] || 0;
    return '<button type="button" class="mrow2" data-mopen="' + esc(m.name) + '">' + dot(m.belt, true) + '<span class="grow"><span class="n">' + esc(m.name) + '</span><span class="s">' +
      esc((m.belt ? m.belt + ' belt · ' : '') + knownTotal(t) + ' kata known') + '</span></span>' + (l ? '<span class="lp">' + l + ' learning</span>' : '') +
      ICON.go.replace('<svg', '<svg class="go"') + '</button>';
  }).join('') + '</div>';
}

/** One member: status counts and their kata, each with Learning / Knows / Proficient buttons. */
function memberPanel(m) {
  var t = tally(m), sts = statuses();
  var tileStyle = ['background:#FCEBDD;color:#8A3F0C', 'background:#E3EBFB;color:#1F4BA5', 'background:#111;color:#fff'];
  var light = beltIndex(m.belt) <= 1;
  var html = '<div class="mpanel"><div class="row" style="gap:14px"><span class="badge2" style="background:' + esc(beltColor(m.belt)) + ';color:' + (light ? '#111' : '#fff') + '">' + esc(initials(m.name)) + '</span>' +
    '<div class="grow"><h2 class="h2" style="font-size:22px">' + esc(m.name) + '</h2><div class="sub">' + esc(m.belt ? m.belt + ' belt' : 'No belt set') + '</div></div></div>' +
    '<div class="tiles">' + sts.map(function (s, i) { return '<div class="tile" style="' + tileStyle[Math.min(i, 2)] + '"><b>' + t[i] + '</b><span>' + esc(s) + '</span></div>'; }).join('') + '</div>' +
    '<div class="row"><h3 class="ct grow" style="font-size:16px">Their kata</h3><button type="button" class="chip" data-msall aria-pressed="' + ms.all + '">' + (ms.all ? 'Only kata they’ve started' : 'Show all kata') + '</button></div>';
  var list = state.data.kata.filter(function (k) { return ms.all || statusOf(m.name, k.name); });
  list.sort(function (a, b) {
    var la = statusIndex(statusOf(m.name, a.name)) === 0 ? 0 : 1, lb = statusIndex(statusOf(m.name, b.name)) === 0 ? 0 : 1;
    return (la - lb) || (expectedIndex(a) - expectedIndex(b)) || (a.order - b.order);
  });
  if (!list.length) html += '<div class="empty" style="padding:12px 0">Nothing started yet. Tap “Show all kata” to mark one.</div>';
  html += '<div>' + list.map(function (k) {
    var ci = statusIndex(statusOf(m.name, k.name));
    return '<div class="krow2"><span class="grow"><span class="n">' + esc(k.name) + '</span><span class="s">' + esc(k.category + ' · ' + k.belt + ' belt kata') + '</span></span><div class="seg">' +
      sts.map(function (s, i) {
        return '<button type="button" class="' + (i === ci ? 'on' + Math.min(i, 2) : '') + '" aria-pressed="' + (i === ci) + '" data-set="' + esc(s) + '" data-who="' + esc(m.name) + '" data-kname="' + esc(k.name) + '">' + esc(s) + '</button>';
      }).join('') + '</div></div>';
  }).join('') + '</div>';
  return html + '<p class="hint" style="margin:0">Tap a status to change it; tap it again to clear it.</p></div>';
}

/** One member's kata. Moderators can change statuses; members (My kata) can ask for changes. */
function memberDetail(m, mine) {
  if (!m) { state.member = null; return memberList(); }
  var bi = beltIndex(m.belt);
  var exp = expectedKata(m), known = knownCount(m, exp);
  var html = mine ? '' : '<button type="button" class="back" data-back>' + ICON.back + 'Members</button>';
  html += '<div><h1>' + esc(m.name) + '</h1><div class="row" style="gap:6px;margin-top:4px;font-size:14px;font-weight:800">' + dot(m.belt) + esc(m.belt ? m.belt + ' belt' : 'No belt set') + '</div></div>';

  var r = isMod() ? readiness(m) : null;
  if (r) {
    var left = r.missing.length;
    html += '<div class="card pad stack" style="gap:12px">' +
      '<div class="row" style="align-items:baseline;gap:8px"><div class="big">' + r.have + '<span style="font-size:20px;color:var(--muted)"> / ' + r.required.length + '</span></div>' +
      '<div class="grow" style="font-size:15px;font-weight:700;color:var(--muted)">kata needed for ' + esc(r.next) + '</div>' +
      (r.ready ? '<span class="tag red">Ready for ' + esc(r.next) + '</span>' : '<span class="tag ink">' + left + ' to go</span>') + '</div>' +
      '<div class="bar big' + (r.ready ? ' red' : '') + '"><i style="width:' + Math.round(r.have / r.required.length * 100) + '%"></i></div>' +
      (r.ready ? '<div class="alert ok">' + ICON.check + '<span>All ' + r.required.length + ' handbook kata at Knows or better.</span></div>'
        : '<div class="alert">' + ICON.info + '<span>Still needs: ' + esc(r.missing.map(function (k) { return k.name; }).join(', ')) + '</span></div>') +
      '</div>';
  }

  var counts = statuses().map(function (s) {
    return state.data.kata.filter(function (k) { return statusOf(m.name, k.name) === s; }).length;
  });
  var tileStyle = ['background:#FCEBDD;color:#8A3F0C', 'background:#E3EBFB;color:#1F4BA5', 'background:#111;color:#fff'];
  html += '<div class="card pad stack" style="gap:12px"><div style="font-size:14px;font-weight:700;color:var(--muted)">Knows ' + known + ' of ' + exp.length + ' kata through ' + esc(m.belt || 'their belt') + '</div>' +
    '<div class="bar big"><i style="width:' + (exp.length ? Math.round(known / exp.length * 100) : 0) + '%"></i></div>' +
    '<div class="tiles">' + statuses().map(function (s, i) {
      return '<div class="tile" style="' + tileStyle[Math.min(i, 2)] + '"><b>' + counts[i] + '</b><span>' + esc(s) + '</span></div>';
    }).join('') + '</div></div>';

  if (mine) {
    var waiting = myRequests().filter(function (q) { return q.member === m.name && q.state === 'Waiting'; }).length;
    if (waiting) html += '<div class="alert">' + ICON.clock + '<span>' + (waiting === 1 ? '1 request' : waiting + ' requests') + ' waiting for an instructor</span></div>';
  }
  html += catChips();
  if (bi >= 0 && bi < belts().length - 1) {
    html += '<div class="chips"><button type="button" class="chip dark" data-higher aria-pressed="' + state.showHigher + '">Show higher-belt kata</button></div>';
  }
  if (isMod()) html += '<p class="hint">Tap a status to change it.</p>';
  else if (mine) html += '<p class="hint">Tap a kata to ask an instructor to change it.</p>';

  var reqMissing = {};
  if (r) r.missing.forEach(function (k) { reqMissing[k.name] = true; });
  var shown = state.data.kata.filter(function (k) { return inCategory(k) && (state.showHigher || bi < 0 || expectedIndex(k) <= bi); });
  var order = [];
  for (var i = (state.showHigher ? belts().length - 1 : bi); i >= 0; i--) order.push(i);
  if (bi < 0) order = belts().map(function (_, i) { return i; }).reverse();
  var body = '';
  order.forEach(function (i) {
    var b = belts()[i];
    var group = shown.filter(function (k) { return expectedIndex(k) === i; });
    if (!group.length) return;
    var kn = knownCount(m, group);
    body += '<section class="card group"><div class="ghead static">' + dot(b.name) + '<span class="grow"><span class="t">' + esc(b.name) + ' belt kata</span>' +
      (i > bi && bi >= 0 ? '<span class="s">Above ' + esc(m.belt) + ' belt</span>' : '') + '</span><span class="tag soft">' + kn + ' / ' + group.length + '</span></div>' +
      group.map(function (k) { return memberKataRow(m, k, reqMissing[k.name] ? r.next : '', mine); }).join('') + '</section>';
  });
  var other = shown.filter(function (k) { return expectedIndex(k) < 0; });
  if (other.length) body += '<section class="card group"><div class="ghead static"><span class="grow"><span class="t">No belt set</span></span></div>' +
    other.map(function (k) { return memberKataRow(m, k, '', mine); }).join('') + '</section>';
  html += body || '<div class="card empty">No kata in this category.</div>';
  return mine ? html : '<div class="stack">' + html + '</div>';
}

function kataSub(k) {
  var bits = [];
  if (k.meaning) bits.push(k.meaning);
  var li = learnedIndex(k), ri = beltIndex(k.belt);
  if (li >= 0 && ri >= 0 && li !== ri) bits.push(k.belt + ' belt kata');
  return bits.join(' · ') || k.category;
}

function memberKataRow(m, k, neededFor, mine) {
  var s = statusOf(m.name, k.name);
  var sub = esc(kataSub(k));
  if (neededFor) sub = '<span class="need">Needed for ' + esc(neededFor) + '</span>' + (sub ? ' · ' + sub : '');
  if (isMod()) {
    return '<div class="krow"><button type="button" class="grow" data-kata="' + esc(k.name) + '" style="border:0;background:none;padding:0;text-align:left;min-height:44px"><span class="n">' + esc(k.name) + '</span><span class="s">' + sub + '</span></button>' +
      '<button type="button" class="st ' + stClass(s) + '" data-choose="' + esc(k.name) + '" data-who="' + esc(m.name) + '" aria-label="' + esc(k.name) + ': ' + esc(s || 'Not started') + '. Change">' + esc(s || 'Not started') + ICON.down + '</button></div>';
  }
  if (mine) {
    var w = waitingReq(m.name, k.name), d = w ? null : declinedReq(m.name, k.name);
    if (w) sub = '<span class="need">Asked for ' + esc(w.to) + ' · waiting</span>';
    else if (d) sub = 'Not changed to ' + esc(d.to) + ' · ask an instructor';
    return '<button type="button" class="krow" data-ask="' + esc(k.name) + '" data-whom="' + esc(m.name) + '"><span class="grow"><span class="n">' + esc(k.name) + '</span><span class="s">' + sub + '</span></span>' +
      stPill(s) + ICON.go.replace('<svg', '<svg class="go"') + '</button>';
  }
  return '<div class="krow"><span class="grow"><span class="n">' + esc(k.name) + '</span><span class="s">' + sub + '</span></span>' + stPill(s) + '</div>';
}

/* ----- My kata (members) ----- */
function myKata() {
  var d = state.data, m = viewedPerson(), mi = me() || {};

  var people = d.members.slice();
  var links = d.myLinks || [];

    html += '<div class="chips" role="group" aria-label="Whose kata">' + people.map(function (p) {
      return '<button type="button" class="chip dark" data-whopick="' + esc(p.name) + '" aria-pressed="' + (!!m && m.name === p.name) + '">' + esc(shortName(p.name)) + '</button>';
    }).join('') + links.map(function (n) { return '<span class="chip wait">' + esc(shortName(n)) + ' · waiting</span>'; }).join('') +
      (mi.canLink ? '<button type="button" class="chip dash" data-linkopen>' + ICON.plus + 'Family member</button>' : '') + '</div>';
  }
  if (!m) {

  }

}

function openAsk(member, kata) {
  var cur = statusOf(member, kata), w = waitingReq(member, kata);
  var sw = [['#FCEBDD', '#8A3F0C'], ['#E3EBFB', '#1F4BA5'], ['#111', '#fff']];
  var hints = ['I’ve started it', 'I can do it on my own', 'I can do it well'];
  var opts = statuses().map(function (s, i) {
    if (s === cur) return '';
    var c = sw[Math.min(i, 2)], on = w && w.to === s;
    return '<button type="button" class="opt" data-askto="' + esc(s) + '" aria-pressed="' + !!on + '"><span class="st" style="background:' + c[0] + ';color:' + c[1] + ';border-color:' + c[0] + '">' + esc(s) + '</span>' +
      '<span style="font-size:13.5px;font-weight:700;color:var(--ink2)">' + esc(hints[i] || '') + '</span></button>';
  }).join('');
  var many = state.data.members.length > 1;
  openSheet('<div class="grab"></div><div class="hint" style="margin:0">Ask an instructor to change</div><h2 id="sheetTitle">' + esc(kata) + '</h2>' +
    '<p>' + (many ? esc(member) + ' · ' : '') + 'Now: ' + esc(cur || 'Not started') + (w ? ' · you asked for ' + esc(w.to) : '') + '</p>' +
    '<div class="opts" id="askOpts" data-member="' + esc(member) + '" data-kname="' + esc(kata) + '">' + opts + '</div>' +
    '<div class="field" style="margin-top:12px"><label for="askNote">Note for the instructor (optional)</label><textarea class="inp" id="askNote" rows="2" maxlength="300" placeholder="e.g. Practised it with Sensei on Thursday">' + esc(w ? w.note : '') + '</textarea></div>' +
    '<div class="ferr" id="askErr" aria-live="polite"></div>' +
    '<div class="btnrow"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn primary" id="askSend" data-sendask' + (w ? '' : ' disabled') + '>' + (w ? 'Update request' : 'Send request') + '</button></div>' +
    (w ? '<button type="button" class="linkbtn" style="margin-top:8px" data-withdraw="' + esc(w.id) + '">Withdraw this request</button>' : ''));
}
function sendAsk() {
  var box = $('askOpts'), pick = box.querySelector('[aria-pressed=true]');
  if (!pick) return;
  var member = box.dataset.member, kata = box.dataset.kname, to = pick.dataset.askto, note = $('askNote').value.trim();
  $('askSend').disabled = true; $('askErr').textContent = '';
  call('requestChange', member, kata, to, note).then(function (res) {
    var list = myRequests().filter(function (q) { return !(q.member === member && q.kata === kata); });
    list.push(res);
    state.data.myRequests = list; cacheData();
    closeSheet(); render();
    toast('Sent. An instructor will check it.');
  }).catch(function (e) { $('askErr').textContent = errMsg(e); $('askSend').disabled = false; });
}
function withdraw(id) {
  call('withdrawRequest', id).then(function () {
    state.data.myRequests = myRequests().filter(function (q) { return q.id !== id; }); cacheData();
    closeSheet(); render(); toast('Request withdrawn');
  }).catch(function (e) { toast('Not withdrawn: ' + errMsg(e), true); });
}
function openLink() {
  openSheet('<div class="grab"></div><h2 id="sheetTitle">Link a family member</h2><p>See and ask about a family member’s kata with your code. An admin checks the request first.</p>' +
    '<form id="linkForm" autocomplete="off"><div class="field"><label for="linkName">Their name, as the dojo has it</label><input class="inp" id="linkName" maxlength="60" placeholder="First and last name" data-focus></div>' +
    '<div class="ferr" id="linkErr" aria-live="polite"></div>' +

}

function decideRequest(id, verdict) {
  var d = state.data;
  var q = (d.requests || []).concat(d.linkRequests || []).filter(function (x) { return x.id === id; })[0];
  if (!q) return;
  var family = q.type === 'Family';
  var was = family ? '' : statusOf(q.member, q.kata);
  var restore = function () {
    if (family) d.linkRequests = [q].concat((d.linkRequests || []).filter(function (x) { return x.id !== id; }));
    else {
      d.requests = [q].concat((d.requests || []).filter(function (x) { return x.id !== id; }));
      d.recent = (d.recent || []).filter(function (x) { return x.id !== id; });
      if (verdict === 'Approved') setProgress(q.member, q.kata, was);
    }
  };
  if (family) d.linkRequests = d.linkRequests.filter(function (x) { return x.id !== id; });
  else {
    d.requests = d.requests.filter(function (x) { return x.id !== id; });
    d.recent = [Object.assign({}, q, { state: verdict, decidedBy: me().name, decided: nowLocal() })].concat(d.recent || []);
    if (verdict === 'Approved') setProgress(q.member, q.kata, q.to);
  }
  render(); toast('Saving…');
  var label = family ? shortName(q.member) + ' for ' + shortName(q.sentBy) : q.kata + ' for ' + first(q.member);
  call('decide', id, verdict).then(function () {
    cacheData();
    undoFn = function () {
      restore(); render(); toast('Undoing…');
      call('undoDecision', id).then(function () { cacheData(); toast('Undone'); load(); })
        .catch(function (e) { toast('Not undone: ' + errMsg(e), true); load(); });
    };
    toast(verdict + ': ' + label, false, true);
    if (family) load();
  }).catch(function (e) { restore(); render(); toast('Not saved: ' + errMsg(e), true); });
}
function setProgress(member, kata, status) {
  if (!state.data.progress[member]) state.data.progress[member] = {};
  if (status) state.data.progress[member][kata] = status; else delete state.data.progress[member][kata];
}

/* ----- Progress grid (moderators): members × kata with filters; tap squares, then one Save ----- */

function gBelt(k) { var l = learnedIndex(k); return gs.mode === 'learned' && l >= 0 ? belts()[l].name : k.belt; }

/* ---------- status changes (moderators): choose → "are you sure" → save → Undo ---------- */
function openChooser(member, kata) {
  var cur = statusOf(member, kata);
  var sw = [['#fff', '#5E5E5E', '1.5px dashed #9A9A9A'], ['#FCEBDD', '#8A3F0C', '0'], ['#E3EBFB', '#1F4BA5', '0'], ['#111', '#fff', '0']];

  }).join('');

    '<div class="btnrow"><button type="button" class="btn" data-close>Cancel</button></div>');

function askChange(member, kata, to) {
  var from = statusOf(member, kata);

  closeSheet();
  pending = { member: member, kata: kata, from: from, to: to };
  var q = to ? 'Mark ' + member + ' as ' + to + ' for ' + kata + '?' : 'Clear ' + member + '’s status for ' + kata + '?';
  showFloat('<div class="confirm" role="alertdialog" aria-label="Confirm change"><div class="q">' + esc(q) + '</div>' +
    '<div class="btnrow"><button type="button" class="btn" data-cancel>Cancel</button><button type="button" class="btn primary" data-confirm>Yes, save</button></div></div>');
  setTimeout(function () { var b = document.querySelector('[data-confirm]'); if (b) b.focus(); }, 30);
}

function save(change, isUndo) {
  var member = change.member, kata = change.kata, before = change.from, after = change.to;
  setProgress(member, kata, after);
  cacheData();
  render();
  toast(isUndo ? 'Undoing…' : 'Saving…');
  call('saveStatus', member, kata, after)
    .then(function () {
      if (isUndo) toast('Undone · ' + first(member) + ' back to ' + (after || 'Not started'));
      else {
        undoFn = function () { save({ member: member, kata: kata, from: after, to: before }, true); };
        toast('Saved · ' + first(member) + ' → ' + (after || 'Not started'), false, true);
      }
    })
    .catch(function (err) {
      setProgress(member, kata, before);
      cacheData();
      render();
      toast('Not saved: ' + errMsg(err), true);
    });

/* ---------- sheets, floats, toasts ---------- */
function openSheet(html) {
  clearTimeout(toastTimer); if (!pending) hideFloat();
  var fresh = $('scrim').hidden;
  if (fresh) { try { history.pushState(Object.assign(snapshot(), { sheet: 1 }), ''); } catch (e) {} }
  var y = $('sheet').scrollTop;
  $('sheet').innerHTML = html; $('scrim').hidden = false; document.body.style.overflow = 'hidden';
  if (!fresh) { $('sheet').scrollTop = y; return; }
  setTimeout(function () { var f = $('sheet').querySelector('[data-focus], input, .opt, button'); if (f) f.focus(); }, 40);
}
function hideSheet() {
  $('scrim').hidden = true; document.body.style.overflow = ''; $('sheet').innerHTML = '';
  state.newCode = null; state.confirm = null;
}
function closeSheet() { if ($('scrim').hidden) return; if (history.state && history.state.sheet) history.back(); else hideSheet(); }
function showFloat(html, cls) { var f = $('float'); f.className = 'float' + (cls ? ' ' + cls : ''); f.innerHTML = html; f.hidden = false; }
function hideFloat() { $('float').hidden = true; $('float').innerHTML = ''; }
var toastTimer;
function toast(msg, bad, undo) {
  clearTimeout(toastTimer);
  pending = null;
  if (!undo) undoFn = null;
  showFloat('<div class="toast' + (bad ? ' bad' : '') + '" role="status">' + (bad ? '' : ICON.check.replace('<svg', '<svg class="ok"')) +
    '<div class="m">' + esc(msg) + '</div>' + (undo ? '<button type="button" class="undo" data-undo>Undo</button>' : '') + '</div>', bad ? 'bad' : '');
  if (!/…$/.test(msg)) toastTimer = setTimeout(function () { hideFloat(); if (undo) undoFn = null; }, undo ? 8000 : bad ? 5000 : 2500);
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('button, a');
  if (!t) {
    var tr = e.target.closest('tr[data-mrow]');
    if (tr) { openMember(tr.dataset.mrow); return; }
    if (e.target === $('scrim')) closeSheet();
    return;
  }
  var d = t.dataset;
  if (t.id === 'acctBtn' || d.acct !== undefined) { if (session) openAccount(); else openSignIn(); }
  else if (d.goto) {
    state.fromPlanner = false;
    // From the account panel, the new screen takes over the panel's history step.
    if (!$('scrim').hidden) { hideSheet(); state.tab = d.goto; state.member = null; state.kata = null; state.query = ''; try { history.replaceState(snapshot(), ''); } catch (x) {} render(); scrollTop(); }
    else go(d.goto);
  }
  else if (d.mopen) { openMember(d.mopen); }
  else if (d.mbelt) { ms.belt = d.mbelt; render(); }
  else if (d.msort) { ms.sort = d.msort; store('kt.msort', d.msort); render(); }
  else if (d.msall !== undefined) { ms.all = !ms.all; render(); }
  else if (d.lf) { ov.lf = d.lf; ov.open = null; render(); }
  else if (d.lopen) { ov.open = ov.open === d.lopen ? null : d.lopen; render(); }
  else if (d.cell) { var ix = d.cell.split(':'); gStep(+ix[0], +ix[1]); }
  else if (d.gsave !== undefined) { gSave(); }
  else if (d.gdiscard !== undefined) { gEdits = {}; gRefresh(); }
  else if (d.gfold !== undefined) { gs.fOpen = !gs.fOpen; gKeep(); render(); }
  else if (d.gsheet !== undefined) { gOpenSheet(); }
  else if (d.gpickopen !== undefined) { gs.pickOpen = !gs.pickOpen; gChanged(); }
  else if (d.gf) {
    var arr = gs[d.gf], at = arr.indexOf(d.gv);
    if (at === -1) arr.push(d.gv); else arr.splice(at, 1);
    gChanged();
  }
  else if (d.gset) { gs[d.gset] = d.gv; gChanged(); }
  else if (d.gclear !== undefined) { Object.assign(gs, { mBelts: [], picked: [], cats: [], req: 'All', kBelts: [], mq: '', kq: '', pickOpen: false }); gChanged(); }
  else if (d.rst) { rd.status = rd.status === d.rst ? null : d.rst; render(); }
  else if (d.rkata) { rd.kata = rd.kata === d.rkata ? null : d.rkata; if (rd.kata) rd.focus = true; render(); }
  else if (d.rfocus !== undefined) { var was = rd.focus || !!rd.kata; rd.focus = !was; if (was) rd.kata = null; render(); }
  else if (d.rclear) { rd[d.rclear] = null; render(); }

  else if (d.pwmode !== undefined) { state.pwMode = d.pwmode === '1'; var f = t.closest('form'); if (f) { f.outerHTML = signInForm(); } }
  else if (d.tab) { if (d.tab === state.tab && !state.member && !state.kata) { scrollTop(); return; } state.fromPlanner = false; go(d.tab); }
  else if (d.whopick) { state.who = d.whopick; render(); }

  else if (d.ask !== undefined) { openAsk(d.whom, d.ask); }

  else if (d.pwoffyes !== undefined) {
    pending = null; hideFloat();
    call('setPassword', false).then(function () { state.data.passwordOn = false; cacheData(); render(); toast('The temporary password is off'); })
      .catch(function (err) { toast('Not changed: ' + errMsg(err), true); });

  else if (d.member !== undefined && t.classList.contains('mrow')) { go('members', d.member); }
  else if (d.kata !== undefined && !d.choose) { go('kata', null, d.kata); }
  else if (d.back !== undefined) { go(state.tab); }
  else if (d.planner !== undefined) { backToPlanner(); }
  else if (d.cat) { state.category = d.cat; render(); }
  else if (d.higher !== undefined) { state.showHigher = !state.showHigher; render(); }
  else if (d.kview) { state.kataView = d.kview; state.needList = null; render(); }
  else if (d.notstarted !== undefined) { state.showNotStarted = !state.showNotStarted; render(); }
  else if (d.rbelt) { rd.belt = rd.belt === d.rbelt ? null : d.rbelt; render(); }
  else if (d.choose) { openChooser(d.who, d.choose); }
  else if (d.pick !== undefined) { var box = t.closest('.opts'); askChange(box.dataset.forMember, box.dataset.forKata, d.pick); }
  else if (d.set !== undefined) { var cur = statusOf(d.who, d.kname); askChange(d.who, d.kname, cur === d.set ? '' : d.set); }
  else if (d.confirm !== undefined) { var c = pending; pending = null; hideFloat(); if (c) save(c); }
  else if (d.cancel !== undefined) { pending = null; hideFloat(); }
  else if (d.undo !== undefined) { var u = undoFn; undoFn = null; if (u) u(); }
  else if (d.close !== undefined) { closeSheet(); }
  else if (d.act === 'refresh') { load(true); }
});

document.addEventListener('submit', function (e) {
  var f = e.target;
  e.preventDefault();
  if (f.classList.contains('signin')) { submitSignIn(f); return; }
  if (f.id === 'linkForm') {
    var name = $('linkName').value.trim();
    if (!name) return;
    $('linkSend').disabled = true; $('linkErr').textContent = '';
    call('requestLink', name).then(function (res) {
      state.data.myLinks = (state.data.myLinks || []).filter(function (n) { return n !== res.member; }).concat([res.member]);
      cacheData(); closeSheet(); render(); toast('Sent. An admin will check it.');
    }).catch(function (err) { $('linkErr').textContent = errMsg(err); $('linkSend').disabled = false; });
  }
  if (f.id === 'addForm') {
    var n = $('addName').value.trim(), lvBtn = $('addLevel').querySelector('[aria-pressed=true]');
    if (!n) return;
    $('addGo').disabled = true; $('addErr').textContent = '';
    call('addPerson', n, lvBtn ? lvBtn.dataset.addlv : 'Member').then(function (res) {
      state.data.access = [{ name: res.name, belt: '', onList: false, level: res.level, hasCode: false, made: '', lastSeen: '', family: [], seenBy: [] }].concat(accessList());
      cacheData(); render(); state.newCode = null; state.confirm = null; openPerson(res.name);
    }).catch(function (err) { $('addErr').textContent = errMsg(err); $('addGo').disabled = false; });
  }
});

// The grid's two search boxes redraw just the table, so typing doesn't lose focus.
document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'gMq' || id === 'gKq') { gs[id === 'gMq' ? 'mq' : 'kq'] = e.target.value; gRefresh(); }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (!$('scrim').hidden) closeSheet(); else if (pending) { pending = null; hideFloat(); } }
});

// Moderators coming back to the app see new requests without pressing Refresh.
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && Date.now() - lastLoad > 30000) load();
});

// Opened from the Lesson Planner as a new tab: close it to land back on the plan.
// If the browser won't let a page close itself, go to the planner instead.
function backToPlanner() {
  try { window.close(); } catch (e) {}
  setTimeout(function () { location.href = PLANNER_URL; }, 400);
}

/* ---------- load (shows the last copy straight away, then refreshes) ---------- */
function cacheData() { try { store('kt.data', JSON.stringify(state.data)); } catch (e) {} }
function load(manual) {
  if (manual) { state.stale = true; render(); }
  lastLoad = Date.now();
  var asked = session;
  call('getData')
    .then(function (data) {
      if (session !== asked) return;              // signed in or out meanwhile
      if (data.signedOut && session) { state.data = data; signOut(true, 'Please sign in again.'); return; }
      state.data = data; state.stale = false;
      if (session && data.me) { session.level = data.me.level; }
      cacheData();
      $('dojoName').textContent = data.dojoName || 'Dojo';
      applyLink();
      render();
    })
    .catch(function (err) {
      state.stale = false;
      if (state.data) { render(); toast('Couldn’t refresh: ' + errMsg(err), true); return; }
      app.innerHTML = '<div class="stack"><div class="err">Could not load the tracker: ' + esc(errMsg(err)) + '</div><button type="button" class="btn" data-act="refresh">Try again</button></div>';
    });
}

var link = null; // ?kata=…&from=planner, from the Lesson Planner's after-class shortcut
function applyLink() {
  if (!link || !state.data) return;
  var l = link; link = null;
  if (l.kata && kataByName(l.kata)) {
    state.fromPlanner = l.from === 'planner';
    state.tab = 'kata'; state.kata = l.kata; state.member = null;
    state.kataView = 'need';
    // Record the kata as this history step, so closing the sign-in panel stays on it.
    try { history.replaceState(snapshot(), '', location.pathname); } catch (e) {}
    if (!isMod()) setTimeout(function () { openSignIn('Sign in as a moderator to mark who has improved on ' + l.kata + '.'); }, 200);
  }
}

(function start() {
  store('kt.pin', null);                          // the old shared-password unlock is gone
  try { session = JSON.parse(recall('kt.session') || srecall('kt.session') || 'null'); } catch (e) { session = null; }
  if (session && !(session.p && session.k)) session = null;
  var cached = null;
  try { cached = JSON.parse(recall('kt.data') || 'null'); } catch (e) {}
  var cachedFor = cached && cached.me ? cached.me.name : null;
  if (cached && cached.kata && cached.members && cachedFor === (session ? session.name : null)) {
    state.data = cached; state.stale = true; $('dojoName').textContent = cached.dojoName || 'Dojo';
  }
  state.tab = homeTab();
  if (PARAMS.get('kata')) { link = { kata: PARAMS.get('kata'), from: PARAMS.get('from') || '' }; applyLink(); }
  // Tidy the address bar (the kata link has been read); back from the first screen leaves the site.
  try { history.replaceState(snapshot(), '', location.pathname); } catch (e) {}
  render();
  load();
})();
})();
</script>
</body>
</html>
